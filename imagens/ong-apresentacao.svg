<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Fundo com gradiente -->
  <rect width="800" height="500" fill="url(#bgGradient)" rx="16" />

  <!-- Detalhe decorativo sutil -->
  <circle cx="700" cy="100" r="180" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="100" cy="420" r="140" fill="#ffffff" fill-opacity="0.04" />

  <!-- Moldura central estilizada -->
  <rect x="60" y="50" width="680" height="400" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Ícone ilustrativo de mãos e união -->
  <g transform="translate(400, 180) scale(1.1)">
    <!-- Sol/Apoio comunitário -->
    <circle cx="0" cy="-20" r="32" fill="#f39c12" />
    <!-- Figuras humanas estilizadas unidas -->
    <circle cx="-50" cy="20" r="18" fill="#3498db" />
    <path d="M-75,70 C-75,40 -25,40 -25,70 Z" fill="#3498db" />
    
    <circle cx="50" cy="20" r="18" fill="#2ecc71" />
    <path d="M25,70 C25,40 75,40 75,70 Z" fill="#2ecc71" />

    <circle cx="0" cy="10" r="22" fill="#e74c3c" />
    <path d="M-30,70 C-30,32 30,32 30,70 Z" fill="#e74c3c" />
  </g>

  <!-- Textos institucionais da ONG -->
  <text x="400" y="320" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ONG MÃOS ABERTAS
  </text>
  <text x="400" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#e0e6ed" text-anchor="middle">
    Educação, Acolhimento e Transformação Social
  </text>
  <text x="400" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#f1c40f" text-anchor="middle" font-weight="600">
    PROJETO COMUNITÁRIO • DESDE 2010
  </text>
</svg>
