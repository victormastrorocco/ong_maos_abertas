<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo de Apoiantes - ONG Mãos Abertas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <h1 class="header__brand">ONG Mãos Abertas</h1>
      <nav aria-label="Navegação principal">
        <ul class="header__nav-list">
          <li><a href="index.html" class="header__link">Início</a></li>
          <li><a href="projetos.html" class="header__link">Nossos Projetos</a></li>
          <li><a href="cadastro.html" class="btn btn--secondary">Quero Apoiar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="formulario-apoio" class="form-section">
      <h2 style="color: var(--color-primary); margin-bottom: 0.5rem;">Junte-se à Nossa Causa</h2>
      <p style="margin-bottom: 2rem;">Preencha os dados abaixo para registar o seu apoio ou candidatura como voluntário.</p>

      <form action="#" method="post" class="grid-12">
        
        <!-- Bloco de inputs com Grid -->
        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="nome-completo">Nome Completo *</label>
          <input class="form-group__input" type="text" id="nome-completo" name="nome" required placeholder="Digite seu nome completo">
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="cpf-usuario">CPF *</label>
          <input class="form-group__input" type="text" id="cpf-usuario" name="cpf" required placeholder="000.000.000-00">
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="data-nasc">Data de Nascimento *</label>
          <input class="form-group__input" type="date" id="data-nasc" name="data_nascimento" required>
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="email-usuario">E-mail *</label>
          <input class="form-group__input" type="email" id="email-usuario" name="email" required placeholder="seuemail@dominio.com">
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="telefone-usuario">Telefone Celular *</label>
          <input class="form-group__input" type="tel" id="telefone-usuario" name="telefone" required placeholder="(11) 99999-9999">
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="cep-usuario">CEP *</label>
          <input class="form-group__input" type="text" id="cep-usuario" name="cep" required placeholder="00000-000">
        </div>

        <div class="col-12 form-group">
          <label class="form-group__label" for="endereco-usuario">Endereço Residencial *</label>
          <input class="form-group__input" type="text" id="endereco-usuario" name="endereco" required placeholder="Rua, Avenida, Número e Bairro">
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="estado-usuario">Estado (UF) *</label>
          <select class="form-group__input" id="estado-usuario" name="estado" required>
            <option value="" disabled selected>Selecione seu Estado...</option>
            <option value="SP">São Paulo (SP)</option>
            <option value="RJ">Rio de Janeiro (RJ)</option>
            <option value="OUTRO">Outro Estado</option>
          </select>
        </div>

        <div class="col-12 col-md-6 form-group">
          <label class="form-group__label" for="tipo-apoio">Como deseja colaborar? *</label>
          <select class="form-group__input" id="tipo-apoio" name="tipo_apoio" required>
            <option value="" disabled selected>Selecione a modalidade...</option>
            <option value="voluntario-educacao">Voluntariado: Reforço Escolar</option>
            <option value="doador-mensal">Apoiador Financeiro Recorrente</option>
          </select>
        </div>

        <div class="col-12 form-group">
          <label class="form-group__label" for="mensagem-usuario">Mensagem / Disponibilidade:</label>
          <textarea class="form-group__input" id="mensagem-usuario" name="mensagem" rows="4" placeholder="Conte-nos um pouco sobre a sua motivação..."></textarea>
        </div>

        <!-- Botões -->
        <div class="col-12" style="display: flex; gap: 1rem; margin-top: 1rem;">
          <button type="submit" class="btn btn--primary">Enviar Cadastro</button>
          <button type="reset" class="btn" style="background-color: var(--color-border);">Limpar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 ONG Mãos Abertas. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
